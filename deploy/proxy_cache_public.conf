# Микрокэш публичных страниц (мультидомен, docs/MULTI-DOMAIN-PLAN.md).
#
# Зачем: host-aware метаданные (self-canonical на каждом домене) сделали публичные
# страницы динамическими — прежний ISR-пререндер Next для них больше не работает.
# Чтобы три домена не утроили нагрузку на app/БД, ответы кэширует nginx.
#
# КЛЮЧ ОБЯЗАТЕЛЬНО СОДЕРЖИТ $host: иначе .kz отдал бы страницу, отрендеренную для
# .by, вместе с чужим canonical/hreflang — ровно то, что мы чиним.
proxy_cache            public;
proxy_cache_key        "$scheme$host$request_uri";
proxy_cache_valid      200 301 302 60s;
proxy_cache_valid      404 10s;
# Next на динамических маршрутах отдаёт no-store — это указание браузеру,
# а не нам: свой кэш держим сами. Set-Cookie НЕ игнорируем — ответ с ним
# nginx не закэширует (защита от утечки чужой сессии).
proxy_ignore_headers   Cache-Control Expires;
# Аналог stale-while-revalidate: отдаём устаревшее и обновляем в фоне.
proxy_cache_use_stale  updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock       on;
# Залогиненный посетитель всегда получает свежий ответ мимо кэша.
proxy_cache_bypass     $has_session;
proxy_no_cache         $has_session;
add_header             X-Cache-Status $upstream_cache_status always;
