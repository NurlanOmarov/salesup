# SalesAcademy nginx — TLS, reverse-proxy, защищённая раздача медиа (CLAUDE.md, правило 2).
# Заготовка под certbot: HTTP-блок отдаёт ACME-challenge и редиректит на HTTPS.

user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # прямые пути к медиа НЕ должны попадать в логи (правило 2/9)
  log_format main '$remote_addr - $status "$request_method $uri" $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  # rate-limit зоны (правило 3 / лимиты AI)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;

  # Признак «у посетителя есть сессия» — такие запросы идут мимо микрокэша.
  # Проверяем сырой Cookie: имя salesup.session-token содержит точку, а $cookie_*
  # нормализует только дефисы, поэтому переменной по имени не обойтись.
  map $http_cookie $has_session {
    default                     0;
    "~*salesup\.session-token=" 1;
  }

  # Микрокэш публичных страниц: 128 МБ на диске контейнера, записи живут 10 минут.
  # Данные не персональные (публичная витрина), при рестарте теряются — это норма.
  proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:5m
                   max_size=128m inactive=10m use_temp_path=off;

  upstream app {
    server app:3000;
  }

  # ── HTTP: ACME + редирект на HTTPS ──────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    # До выпуска сертификата можно временно проксировать на app (см. комментарий).
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ───────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # certbot подложит сертификаты сюда (S6.3/предзапуск)
    ssl_certificate     /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # security-заголовки (предзапуск S6.4)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # auth / ai — под rate-limit
    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }
    location /api/ai/ {
      limit_req zone=ai burst=10 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }

    # защищённое медиа: отдаётся ТОЛЬКО по X-Accel-Redirect от app (internal).
    # Снаружи каталог media не виден; прямого доступа нет.
    # ── Публичная витрина: микрокэш с ключом по домену ──────────────────────
    # Единственные индексируемые страницы; на каждом домене свой вариант ответа.
    location = / {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }
    location ^~ /courses {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }
    location ~ ^/(business|offer|offer-b2b|privacy|sitemap\.xml|robots\.txt|llms\.txt)$ {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }

    location /protected-media/ {
      internal;
      alias /media/;
      add_header Cache-Control "private, no-store" always;
    }

    location / {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
