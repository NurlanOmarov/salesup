# SalesAcademy nginx — ВРЕМЕННЫЙ профиль для доступа по IP:порту БЕЗ домена и TLS.
# Используется на временном VPS (DatabaseMart) до привязки домена и certbot.
# Подключение: в docker-compose.yml смонтировать ./nginx.http.conf вместо ./nginx.conf.
#
# ⚠️ Без HTTPS cookie сессии помечаются НЕ-Secure (иначе браузер их не отправит по http).
#    Управляется переменной AUTH_COOKIE_INSECURE=true (см. lib/auth, Sprint 1) — включать
#    ТОЛЬКО на временном стенде, на боевом домене с TLS должно быть false.

user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $status "$request_method $uri" $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;

  # За центральным edge-nginx TLS терминируется там, а к нам приходит http.
  # Edge передаёт X-Forwarded-Proto=https → пробрасываем именно его в app (Secure-cookie,
  # правильные абсолютные URL). Если заголовка нет (прямой доступ) — берём свою схему.
  map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
  }

  # Признак «у посетителя есть сессия» — такие запросы идут мимо микрокэша.
  # Проверяем сырой Cookie: имя salesup.session-token содержит точку, а $cookie_*
  # нормализует только дефисы, поэтому переменной по имени не обойтись.
  map $http_cookie $has_session {
    default                     0;
    "~*salesup\.session-token=" 1;
  }

  # Микрокэш публичных страниц: 128 МБ на диске контейнера, записи живут 10 минут.
  # Данные не персональные (публичная витрина), при рестарте теряются — это норма.
  proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:5m
                   max_size=128m inactive=10m use_temp_path=off;

  upstream app {
    server app:3000;
  }

  server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }
    location /api/ai/ {
      limit_req zone=ai burst=10 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Публичная витрина: микрокэш с ключом по домену ──────────────────────
    # Единственные индексируемые страницы; на каждом домене свой вариант ответа.
    location = / {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }
    location ^~ /courses {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }
    location ~ ^/(business|offer|offer-b2b|privacy|sitemap\.xml|robots\.txt|llms\.txt)$ {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
      include /etc/nginx/proxy_cache_public.conf;
    }

    location /protected-media/ {
      internal;
      alias /media/;
      add_header Cache-Control "private, no-store" always;
    }

    location / {
      proxy_pass http://app;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
