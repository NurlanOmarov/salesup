# SalesAcademy — PRODUCTION (временный VPS DatabaseMart, доступ по IP:порту без домена).
#
# Отличия от deploy/docker-compose.yml (локальная сборка):
#   • app/worker НЕ собираются на сервере — тянутся готовыми из GHCR (сборка в GitHub Actions).
#     Сервер с ~1.6 ГБ RAM не должен строить Next.js (риск OOM для соседних проектов).
#   • nginx публикуется на ОТДЕЛЬНЫЙ порт 8444 (80/443 заняты центральным labai-nginx).
#     TLS нет → nginx.http.conf, AUTH_COOKIE_INSECURE=true (D-007).
#   • Полностью изолирован: своя bridge-сеть, к labai-network НЕ подключается.
#
# Запуск (выполняет workflow deploy.yml):
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesacademy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-salesacademy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesacademy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Ротация логов. Проверено 2026-08-24: глобальный /etc/docker/daemon.json
    # через `systemctl reload docker` НЕ применяется (reload не перечитывает
    # log-opts) — контейнер без явных опций писал один json.log на 31 МБ и рос
    # дальше. С этими опциями получается 3 файла по 10 МБ: потолок 30 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m

  app:
    image: ${IMAGE_APP:-ghcr.io/nurlanomarov/salesup-app:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      # AUTH_URL намеренно НЕ задаём: он пиннил Auth.js на один домен и ломал
      # самостоятельность .kz/.ru (мультидомен, docs/MULTI-DOMAIN-PLAN.md).
      # Базовый URL берётся из заголовков запроса (trustHost в src/auth.config.ts),
      # а внутренний http://0.0.0.0:3000 больше не появляется — /api/auth выведен
      # из-под middleware (src/middleware.ts).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}     # голосовой симулятор (STT/TTS)
      MEDIA_ROOT: /media
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET}
      VIDEO_KEY_ENC_SECRET: ${VIDEO_KEY_ENC_SECRET}
      VIDEO_XACCEL: "true"                       # сегменты отдаёт nginx (X-Accel-Redirect)
      AUTH_COOKIE_INSECURE: ${AUTH_COOKIE_INSECURE:-true}  # IP без TLS → cookie без Secure
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      OWNER_EMAIL: ${OWNER_EMAIL}
      # app только ставит письма в очередь (адресат заявок), сам SMTP не трогает
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-omarov.nb@gmail.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - media:/media                              # app пишет обложки/OG сам (admin upload) + читает медиа фабрики
    expose:
      - "3000"
    # Ротация логов. Проверено 2026-08-24: глобальный /etc/docker/daemon.json
    # через `systemctl reload docker` НЕ применяется (reload не перечитывает
    # log-opts) — контейнер без явных опций писал один json.log на 31 МБ и рос
    # дальше. С этими опциями получается 3 файла по 10 МБ: потолок 30 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 640m

  worker:
    image: ${IMAGE_WORKER:-ghcr.io/nurlanomarov/salesup-worker:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY}
      MEDIA_ROOT: /media
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET}
      VIDEO_KEY_ENC_SECRET: ${VIDEO_KEY_ENC_SECRET}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OWNER_EMAIL: ${OWNER_EMAIL}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-omarov.nb@gmail.com}
      # Telegram-уведомления о заявках отправляет именно worker
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - media:/media                             # worker (фабрика) пишет медиа
    # Ротация логов. Проверено 2026-08-24: глобальный /etc/docker/daemon.json
    # через `systemctl reload docker` НЕ применяется (reload не перечитывает
    # log-opts) — контейнер без явных опций писал один json.log на 31 МБ и рос
    # дальше. С этими опциями получается 3 файла по 10 МБ: потолок 30 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Порт на хост НЕ публикуем: доступ снаружи — только через центральный edge-nginx
    # (compose-проект infra) по поддомену study.activesales.by. См. docs/MIGRATION-RUNBOOK.md.
    networks:
      default: {}                    # внутренняя сеть проекта: app, db, worker
      edge-net:
        aliases: [salesup-nginx]     # под этим именем edge проксирует трафик на наш nginx
    volumes:
      - ./nginx.http.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./proxy_cache_public.conf:/etc/nginx/proxy_cache_public.conf:ro
      - media:/media:ro                          # X-Accel-Redirect раздаёт из /media (internal)
    # Ротация логов — см. пояснение выше. Для nginx особенно важна: он пишет
    # access-лог на каждый запрос, то есть растёт быстрее всех остальных сервисов.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  media:

# Общая внешняя сеть с центральным edge-nginx. Создаётся один раз на сервере:
#   docker network create edge-net
# В неё входит ТОЛЬКО nginx; db/app/worker остаются в изолированной default-сети.
networks:
  edge-net:
    external: true
