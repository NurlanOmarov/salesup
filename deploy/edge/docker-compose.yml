# Центральный edge-reverse-proxy нового VPS (93.127.131.216).
# Владеет 80/443, терминирует TLS (certbot) и маршрутизирует по поддоменам на проекты
# через общую внешнюю docker-сеть edge-net. См. docs/MIGRATION-RUNBOOK.md.
#
# Разворачивается ОТДЕЛЬНО от SalesUp, в своём каталоге на сервере (например /home/administrator/infra):
#   docker network create edge-net          # один раз
#   docker compose up -d
#
# Добавление нового проекта = ещё один server-блок в conf.d/ + подключение его nginx к edge-net.

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks: [edge-net]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Авто-продление раз в 12 ч; выпуск первого сертификата — вручную (см. README.md).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-www:
  certbot-certs:

networks:
  edge-net:
    external: true
