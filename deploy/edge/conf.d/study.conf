# SalesUp — поддомен study.activesales.by → внутренний nginx проекта (alias salesup-nginx).
#
# ⚠️ Первый запуск (проблема «курица-яйцо»): сертификата ещё нет, а 443-блок на него ссылается.
#    Порядок: поднять edge только с HTTP-блоком (закомментировать 443-блок) → выпустить cert
#    (см. deploy/edge/README.md) → раскомментировать 443-блок → `docker compose exec edge nginx -s reload`.

# 1) HTTP: ACME-проверка certbot + редирект остального на HTTPS
server {
  listen 80;
  server_name study.activesales.by;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# 2) HTTPS → внутренний nginx SalesUp по общей сети edge-net
server {
  listen 443 ssl;
  http2 on;
  server_name study.activesales.by;

  ssl_certificate     /etc/letsencrypt/live/study.activesales.by/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/study.activesales.by/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://salesup-nginx:80;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;                       # study.activesales.by (без порта)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;                       # ← app должен знать про TLS
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 300s;
  }
}
