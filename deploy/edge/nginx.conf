# Базовый конфиг edge-nginx: подключает server-блоки проектов из conf.d/*.conf.
user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 20m;   # согласовано с внутренним nginx проектов (загрузки/аватары)

  log_format edge '$remote_addr - $host - $status "$request_method $uri" $body_bytes_sent';
  access_log /var/log/nginx/access.log edge;

  # Дефолтный сервер: закрываем прямые запросы по IP/чужому Host (444 = молча рвём соединение).
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  include /etc/nginx/conf.d/*.conf;
}
