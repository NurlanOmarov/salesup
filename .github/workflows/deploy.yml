name: Deploy

# Сборка образов app/worker в GitHub Actions → push в GHCR → сервер только тянет и поднимает.
# Сервер ( необходимый минимум RAM) НЕ собирает Next.js, чтобы не уронить соседние проекты (OOM).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплои выполняются строго поочерёдно. Новый пуш встаёт в очередь и ждёт завершения
# текущего, а не отменяет его — иначе можно оборвать деплой до `prisma migrate deploy`.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/nurlanomarov/salesup-app
  IMAGE_WORKER: ghcr.io/nurlanomarov/salesup-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ github.sha }}
          # NEXT_PUBLIC_* инлайнятся в клиентский бандл на этапе build — передаём реальные значения
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ secrets.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_SUPPORT_TELEGRAM=${{ secrets.NEXT_PUBLIC_SUPPORT_TELEGRAM }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ secrets.NEXT_PUBLIC_SUPPORT_PHONE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # для pull приватных образов из GHCR по GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      # Копируем только инфра-файлы деплоя в папку проекта на сервере.
      # strip_components=1 убирает префикс deploy/ → файлы лягут в корень папки проекта.
      # ⚠️ Список исчерпывающий: новый файл, смонтированный в compose, ОБЯЗАН быть
      # добавлен сюда. Иначе Docker создаст на его месте каталог, и nginx уйдёт в
      # рестарт-петлю с «Is a directory» (прод падал так 2026-08-18).
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/docker-compose.prod.yml,deploy/nginx.http.conf,deploy/proxy_params.conf,deploy/proxy_cache_public.conf"
          target: "/home/administrator/salesup"
          strip_components: 1

      - name: Pull images & (re)start on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /home/administrator/salesup

            # .env генерируется из секретов на каждый деплой (не хранится в git).
            umask 077
            cat > .env <<EOF
            POSTGRES_USER=salesacademy
            POSTGRES_DB=salesacademy
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://salesacademy:${{ secrets.POSTGRES_PASSWORD }}@db:5432/salesacademy
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            EMBEDDINGS_API_KEY=${{ secrets.EMBEDDINGS_API_KEY }}
            VOICE_ENABLED=true
            AVATAR_ENABLED=true
            VIDEO_SIGNING_SECRET=${{ secrets.VIDEO_SIGNING_SECRET }}
            VIDEO_KEY_ENC_SECRET=${{ secrets.VIDEO_KEY_ENC_SECRET }}
            STORAGE_DRIVER=fs
            AUTH_COOKIE_INSECURE=false
            # Почта — необязательный дубль Telegram-уведомлений: включается,
            # когда в секретах заданы EMAIL_ENABLED=true и SMTP_* (Gmail/Zoho).
            EMAIL_ENABLED=${{ secrets.EMAIL_ENABLED || 'false' }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '465' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}
            LEADS_NOTIFY_EMAIL=${{ secrets.LEADS_NOTIFY_EMAIL || 'omarov.nb@gmail.com' }}
            # Уведомления о заявках в Telegram (docs/TELEGRAM.md): секреты репозитория.
            # Пусто → worker молча пропускает отправку.
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            IMAGE_APP=ghcr.io/nurlanomarov/salesup-app:${{ github.sha }}
            IMAGE_WORKER=ghcr.io/nurlanomarov/salesup-worker:${{ github.sha }}
            EOF
            chmod 600 .env

            # GHCR — приватный реестр: логинимся для pull встроенным GITHUB_TOKEN
            # (действует на время запуска; PAT создавать не нужно).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"

            $COMPOSE pull
            $COMPOSE up -d db
            # Миграции — через worker-образ (в нём есть prisma CLI и prisma/migrations).
            $COMPOSE run --rm worker pnpm prisma migrate deploy
            $COMPOSE up -d
            # app при обновлении образа получает новый IP, а nginx кеширует адрес
            # апстрима с момента старта → перезапуск nginx пере-резолвит app (иначе 502).
            $COMPOSE restart nginx
            # Чистка образов. `prune -f` без -a убирает только «висячие» слои, а
            # каждый релиз оставляет ТЕГИРОВАННУЮ пару app+worker (~2.9 ГБ) — под
            # этот фильтр она не попадала, и за время работы на VPS скопилось 78
            # образов и 26 ГБ мусора при диске 63 ГБ (дошло до 96 % занятости).
            # -a убирает и тегированные, а образы работающих контейнеров не трогаются
            # в любом случае.
            #
            # 2026-08-24: порог снижен 168h → 48h. Недели оказалось мало: при такой
            # частоте релизов под фильтр не попадали образы моложе 7 суток, и их
            # накопилось 57 штук — 13.4 ГБ из 18.4 ГБ (72 % мусора), диск дошёл до 79 %.
            # Каждый релиз добавляет пару app (662 МБ) + worker (2.27 ГБ) = ~2.9 ГБ.
            # Двух дней для отката достаточно: плохой релиз виден в первые часы,
            # а вернуться всегда можно `docker pull` нужного sha-тега из GHCR.
            docker image prune -af --filter "until=48h"
            docker container prune -f --filter "until=48h"   # обрывки от `run --rm`
            docker builder prune -af --filter "until=48h"    # сборки здесь нет, но на всякий

            echo "--- занятость после чистки ---"
            docker system df
            df -h / | tail -1

            docker logout ghcr.io || true

  # GHCR тоже копит: каждый релиз кладёт туда пару образов с тегом sha, а у приватных
  # пакетов есть квота хранилища. Оставляем 10 последних версий.
  # continue-on-error: удаление версий пакетов пользователя иногда требует PAT —
  # если GITHUB_TOKEN не хватит прав, деплой из-за этого падать не должен.
  cleanup-registry:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    strategy:
      matrix:
        package: [salesup-app, salesup-worker]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
