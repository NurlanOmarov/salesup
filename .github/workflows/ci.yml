name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # версия pnpm берётся из поля "packageManager" в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # фиктивные значения — сборка не подключается к внешним сервисам
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          ANTHROPIC_API_KEY: ci-dummy
          EMBEDDINGS_API_KEY: ci-dummy
          MEDIA_ROOT: /tmp/media
          VIDEO_SIGNING_SECRET: ci_dummy_secret_at_least_16
          VIDEO_KEY_ENC_SECRET: ci_dummy_secret_at_least_16
          OWNER_EMAIL: owner@example.kz
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
