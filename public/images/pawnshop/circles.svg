<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Круги близости: ближний круг семьи, средний круг друзей и коллег, дальний круг случайных знакомых, где по умолчанию находится клиент ломбарда">
  <defs>
    <style>
      .ring-far { fill: #e2e8f0; fill-opacity: .45; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; }
      .ring-mid { fill: #dbeafe; fill-opacity: .55; stroke: #6366f1; stroke-width: 2.5; }
      .ring-near { fill: #d1fae5; fill-opacity: .7; stroke: #059669; stroke-width: 2.5; }
      .ring-cap { font: 700 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; letter-spacing: 1.4px; }
      .cap-far { fill: #475569; }
      .cap-mid { fill: #4f46e5; }
      .cap-near { fill: #047857; }
      .who { font: 500 11.5px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .core { font: 800 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .title { font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; letter-spacing: 1.5px; }
      .chip { fill: #ffffff; stroke: #ef4444; stroke-width: 2.5; }
      .chip-cap { font: 700 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; text-anchor: middle; }
      .note { font: 600 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .hint { font: 500 11.5px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .arrow { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <!-- Светлая подложка: схема живёт и в тёмном кабинете, и на белой раздатке. -->
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" />

  <text class="title" x="320" y="26">КРУГИ БЛИЗОСТИ</text>

  <circle class="ring-far" cx="320" cy="205" r="160" />
  <circle class="ring-mid" cx="320" cy="205" r="105" />
  <circle class="ring-near" cx="320" cy="205" r="55" />

  <text class="ring-cap cap-far" x="320" y="62">ДАЛЬНИЙ КРУГ</text>
  <text class="who" x="320" y="80">случайные знакомые</text>

  <text class="ring-cap cap-mid" x="320" y="120">СРЕДНИЙ КРУГ</text>
  <text class="who" x="320" y="137">друзья и коллеги</text>

  <text class="core" x="320" y="196">Ближний круг</text>
  <text class="who" x="320" y="214">семья</text>
  <text class="who" x="320" y="230">решаем в одну фразу</text>

  <!-- Клиент: по умолчанию снаружи -->
  <rect class="chip" x="470" y="38" width="150" height="46" rx="10" />
  <text class="chip-cap" x="545" y="60">Клиент</text>
  <text class="hint" x="545" y="76">здесь по умолчанию</text>

  <line class="arrow" x1="500" y1="90" x2="390" y2="170" />

  <text class="note" x="128" y="300">Стать своим на 5 минут</text>
  <text class="hint" x="128" y="318">говорим как близкий знакомый</text>

  <text class="note" x="512" y="300">Дружить после сделки</text>
  <text class="hint" x="512" y="318">не требуется</text>

  <text class="hint" x="320" y="384" style="font-style: italic">Чем дальше круг, тем дольше приходится объяснять</text>
</svg>
