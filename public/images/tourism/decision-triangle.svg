<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Три вещи, которые покупает турист: продукт, компания и продавец; влияние продавца — 87 процентов">
  <defs>
    <style>
      .card { fill: #0ea5e9; fill-opacity: .13; stroke: #0284c7; stroke-width: 2.5; stroke-linejoin: round; }
      .card-seller { fill: #d97706; fill-opacity: .2; stroke: #b45309; }
      .cap { font: 800 19px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .hint { font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .share { font: 800 30px/1 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b45309; text-anchor: middle; }
      .title { font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; letter-spacing: 1.5px; }
      .link { fill: none; stroke: #cbd5e1; stroke-width: 2.5; stroke-dasharray: 7 6; }
      .tourist { fill: #10b981; fill-opacity: .16; stroke: #059669; stroke-width: 2.5; }
    </style>
    <marker id="th" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Светлая подложка: схема живёт и в тёмном кабинете, и на белой раздатке —
       без неё тёмные заголовки пропадают на тёмном фоне. -->
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" />

  <text class="title" x="320" y="34">РЕШЕНИЕ ТУРИСТА СКЛАДЫВАЕТСЯ ИЗ ТРЁХ ВЕЩЕЙ</text>

  <!-- Продукт -->
  <rect class="card" x="34" y="62" width="168" height="112" rx="12" />
  <text class="cap" x="118" y="108">Продукт</text>
  <text class="hint" x="118" y="132">место, куда он полетит,</text>
  <text class="hint" x="118" y="150">и как устроен тур</text>

  <!-- Компания -->
  <rect class="card" x="236" y="62" width="168" height="112" rx="12" />
  <text class="cap" x="320" y="108">Компания</text>
  <text class="hint" x="320" y="132">можно ли доверять,</text>
  <text class="hint" x="320" y="150">надёжна ли она</text>

  <!-- Продавец -->
  <rect class="card card-seller" x="438" y="62" width="168" height="112" rx="12" />
  <text class="cap" x="522" y="100">Продавец</text>
  <text class="share" x="522" y="140">87 %</text>
  <text class="hint" x="522" y="160">влияния на решение</text>

  <!-- связи к туристу -->
  <path class="link" d="M118 174 C118 220 240 224 300 248" marker-end="url(#th)" />
  <path class="link" d="M320 174 V244" marker-end="url(#th)" />
  <path class="link" d="M522 174 C522 220 400 224 340 248" marker-end="url(#th)" />

  <!-- Турист -->
  <rect class="tourist" x="196" y="254" width="248" height="86" rx="12" />
  <text class="cap" x="320" y="292">Турист принимает решение</text>
  <text class="hint" x="320" y="316">последний аргумент почти всегда говорит продавец</text>

  <text class="hint" x="320" y="372" style="font-style: italic">«Никакой крутой сайт и скрипт не сделают продажу до конца — продавец продаёт лучше»</text>
</svg>
