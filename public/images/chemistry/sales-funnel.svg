<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Воронка продаж промышленной химии: восемь этапов от первичного контакта до повторной закупки с нормами конверсии между этапами">
  <defs>
    <style>
      .st { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.2; }
      .st-last { fill: #d1fae5; stroke: #059669; stroke-width: 2.2; }
      .cap { font: 800 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .sub { font: 500 11px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .conv { font: 800 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b45309; text-anchor: start; }
      .title { font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; letter-spacing: 1.5px; }
      .foot { font: italic 500 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Светлая подложка: схема живёт и в тёмном кабинете, и на белой раздатке. -->
  <rect x="0" y="0" width="640" height="520" rx="14" fill="#ffffff" />
  <text class="title" x="320" y="30">ВОРОНКА ПРОДАЖ ПРОМЫШЛЕННОЙ ХИМИИ</text>
  <rect class="st" x="100" y="48" width="440" height="44" rx="9" />
  <text class="cap" x="320" y="67">Первичный контакт</text>
  <text class="sub" x="320" y="83">звонок, письмо</text>
  <rect class="st" x="115" y="104" width="410" height="44" rx="9" />
  <text class="cap" x="320" y="123">Встреча</text>
  <text class="sub" x="320" y="139">выявление потребностей</text>
  <line class="arrow" x1="320" y1="92" x2="320" y2="104" />
  <text class="conv" x="550" y="103">→ 30–40%</text>
  <rect class="st" x="130" y="160" width="380" height="44" rx="9" />
  <text class="cap" x="320" y="179">Тест образцов</text>
  <text class="sub" x="320" y="195">техническая консультация</text>
  <line class="arrow" x1="320" y1="148" x2="320" y2="160" />
  <text class="conv" x="535" y="159">→ 50–60%</text>
  <rect class="st" x="145" y="216" width="350" height="44" rx="9" />
  <text class="cap" x="320" y="235">Коммерческое предложение</text>
  <text class="sub" x="320" y="251">после успешного теста</text>
  <line class="arrow" x1="320" y1="204" x2="320" y2="216" />
  <text class="conv" x="520" y="215">→ ≈ 80%</text>
  <rect class="st" x="160" y="272" width="320" height="44" rx="9" />
  <text class="cap" x="320" y="291">Переговоры</text>
  <text class="sub" x="320" y="307">2–3 поставщика в сравнении</text>
  <line class="arrow" x1="320" y1="260" x2="320" y2="272" />
  <text class="conv" x="505" y="271">→ 60–70%</text>
  <rect class="st" x="175" y="328" width="290" height="44" rx="9" />
  <text class="cap" x="320" y="347">Договор</text>
  <text class="sub" x="320" y="363">цена и условия</text>
  <line class="arrow" x1="320" y1="316" x2="320" y2="328" />
  <text class="conv" x="490" y="327">→ 40–60%</text>
  <rect class="st" x="190" y="384" width="260" height="44" rx="9" />
  <text class="cap" x="320" y="403">Первая поставка</text>
  <text class="sub" x="320" y="419">юристы и логистика заранее</text>
  <line class="arrow" x1="320" y1="372" x2="320" y2="384" />
  <text class="conv" x="475" y="383">→ ≈ 90%</text>
  <rect class="st-last" x="205" y="440" width="230" height="44" rx="9" />
  <text class="cap" x="320" y="459">Повторная закупка</text>
  <text class="sub" x="320" y="475">без рекламаций и срывов</text>
  <line class="arrow" x1="320" y1="428" x2="320" y2="440" />
  <text class="conv" x="460" y="439">→ 70–80%</text>
  <text class="foot" x="320" y="506">Нормы конверсии от этапа к этапу — ориентир из урока</text>
</svg>
