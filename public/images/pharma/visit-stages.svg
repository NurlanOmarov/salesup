<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Пять этапов визита медпреда: контакт, выявление потребности, презентация, работа с возражениями, закрытие">
  <defs>
    <style>
      .row { fill: #0ea5e9; fill-opacity: .12; stroke: #0284c7; stroke-width: 2.5; stroke-linejoin: round; }
      .row-last { fill: #d97706; fill-opacity: .18; stroke: #b45309; }
      .badge { fill: #0284c7; }
      .badge-last { fill: #b45309; }
      .num { font: 800 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; }
      .name { font: 800 17px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .hint { font: 500 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .title { font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; letter-spacing: 1.5px; }
      .foot { font: 500 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; font-style: italic; }
      .link { fill: none; stroke: #cbd5e1; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Светлая подложка: схема живёт и в тёмном кабинете, и на белой раздатке —
       без неё тёмные заголовки пропадают на тёмном фоне. -->
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" />

  <text class="title" x="320" y="30">ПЯТЬ ЭТАПОВ ВИЗИТА — ПО ПОРЯДКУ</text>

  <!-- связка между этапами -->
  <path class="link" d="M60 96 V330" />

  <!-- 1. Контакт -->
  <rect class="row" x="28" y="44" width="584" height="56" rx="12" />
  <circle class="badge" cx="60" cy="72" r="16" />
  <text class="num" x="60" y="78">1</text>
  <text class="name" x="92" y="68">Контакт</text>
  <text class="hint" x="92" y="88">представиться, обозначить цель, установить доверие</text>

  <!-- 2. Выявление потребности -->
  <rect class="row" x="28" y="108" width="584" height="56" rx="12" />
  <circle class="badge" cx="60" cy="136" r="16" />
  <text class="num" x="60" y="142">2</text>
  <text class="name" x="92" y="132">Выявление потребности</text>
  <text class="hint" x="92" y="152">открытые и СПИН-вопросы: понять, что важно врачу</text>

  <!-- 3. Презентация -->
  <rect class="row" x="28" y="172" width="584" height="56" rx="12" />
  <circle class="badge" cx="60" cy="200" r="16" />
  <text class="num" x="60" y="206">3</text>
  <text class="name" x="92" y="196">Презентация</text>
  <text class="hint" x="92" y="216">решение на языке выгод — под выявленную потребность</text>

  <!-- 4. Работа с возражениями -->
  <rect class="row" x="28" y="236" width="584" height="56" rx="12" />
  <circle class="badge" cx="60" cy="264" r="16" />
  <text class="num" x="60" y="270">4</text>
  <text class="name" x="92" y="260">Работа с возражениями</text>
  <text class="hint" x="92" y="280">выслушать, уточнить, снять сомнение аргументом</text>

  <!-- 5. Закрытие -->
  <rect class="row row-last" x="28" y="300" width="584" height="56" rx="12" />
  <circle class="badge badge-last" cx="60" cy="328" r="16" />
  <text class="num" x="60" y="334">5</text>
  <text class="name" x="92" y="324">Закрытие</text>
  <text class="hint" x="92" y="344">договорённость и конкретный следующий шаг</text>

  <text class="foot" x="320" y="380">Пропущенный этап всплывает возражением на следующем</text>
</svg>
