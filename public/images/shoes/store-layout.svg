<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="План торгового зала обувного салона: вход, стеллажи, зона примерки с зеркалом, стойка аксессуаров и касса">
  <defs>
    <style>
      .wall { fill: none; stroke: #64748b; stroke-width: 3; }
      .shelf { fill: #94a3b8; fill-opacity: .22; stroke: #64748b; stroke-width: 2; }
      .box { fill: #d97706; fill-opacity: .35; stroke: #b45309; stroke-width: 1.5; }
      .soft { fill: #0ea5e9; fill-opacity: .18; stroke: #0284c7; stroke-width: 2; }
      .mirror { fill: #38bdf8; fill-opacity: .3; stroke: #0284c7; stroke-width: 2.5; }
      .lbl { font: 500 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .lbl-sm { font: 500 11px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .person { fill: #64748b; fill-opacity: .5; }
    </style>
  </defs>

  <!-- стены зала -->
  <rect class="wall" x="24" y="24" width="592" height="372" rx="16" />

  <!-- вход: разрыв в нижней стене -->
  <rect x="196" y="386" width="120" height="20" fill="#fff" fill-opacity="0" />
  <path d="M196 396 H140" class="wall" />
  <path d="M316 396 H600" class="wall" />
  <path d="M24 396 H140" class="wall" stroke-opacity="0" />
  <path d="M196 396 h120" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" fill="none" />
  <text class="lbl" x="256" y="414" text-anchor="middle">вход</text>

  <!-- пунктирный маршрут покупателя -->
  <path class="flow" d="M256 380 C256 340 250 320 210 300 C150 275 120 240 128 190 C136 145 190 130 250 140 C320 152 350 200 420 210 C480 218 520 240 528 200 C534 165 520 130 512 100" />

  <!-- левый стеллаж -->
  <g>
    <rect class="shelf" x="44" y="72" width="60" height="230" rx="8" />
    <g>
      <rect class="box" x="54" y="86" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="112" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="138" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="164" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="190" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="216" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="242" width="40" height="18" rx="3" />
      <rect class="box" x="54" y="268" width="40" height="18" rx="3" />
    </g>
    <text class="lbl-sm" x="74" y="318" text-anchor="middle">витрина</text>
  </g>

  <!-- верхний стеллаж -->
  <g>
    <rect class="shelf" x="140" y="48" width="250" height="52" rx="8" />
    <g>
      <rect class="box" x="152" y="60" width="40" height="18" rx="3" />
      <rect class="box" x="200" y="60" width="40" height="18" rx="3" />
      <rect class="box" x="248" y="60" width="40" height="18" rx="3" />
      <rect class="box" x="296" y="60" width="40" height="18" rx="3" />
      <rect class="box" x="344" y="60" width="34" height="18" rx="3" />
    </g>
    <text class="lbl-sm" x="265" y="94" text-anchor="middle">новая коллекция</text>
  </g>

  <!-- центральный островок -->
  <g>
    <rect class="shelf" x="176" y="176" width="176" height="72" rx="10" />
    <rect class="box" x="192" y="192" width="44" height="20" rx="3" />
    <rect class="box" x="248" y="192" width="44" height="20" rx="3" />
    <rect class="box" x="304" y="192" width="34" height="20" rx="3" />
    <text class="lbl-sm" x="264" y="238" text-anchor="middle">островок · хиты сезона</text>
  </g>

  <!-- зона примерки: пуф + зеркало -->
  <g>
    <rect class="soft" x="392" y="236" width="120" height="44" rx="14" />
    <text class="lbl-sm" x="452" y="264" text-anchor="middle">пуф для примерки</text>
    <ellipse class="mirror" cx="562" cy="266" rx="16" ry="52" />
    <text class="lbl-sm" x="562" y="340" text-anchor="middle">зеркало</text>
  </g>

  <!-- стойка аксессуаров у зеркала -->
  <g>
    <rect class="shelf" x="404" y="140" width="150" height="56" rx="8" />
    <circle class="box" cx="428" cy="168" r="12" />
    <rect class="box" x="452" y="156" width="34" height="24" rx="4" />
    <rect class="box" x="498" y="158" width="40" height="20" rx="4" />
    <text class="lbl-sm" x="479" y="132" text-anchor="middle">крем · стельки · сумки</text>
  </g>

  <!-- касса -->
  <g>
    <rect class="shelf" x="452" y="48" width="130" height="52" rx="8" />
    <rect class="box" x="470" y="62" width="36" height="24" rx="4" />
    <circle class="box" cx="540" cy="74" r="13" />
    <text class="lbl" x="517" y="120" text-anchor="middle">касса</text>
  </g>

  <!-- продавец на позиции: не в проходе, но в поле зрения входа -->
  <g class="person">
    <circle cx="146" cy="326" r="11" />
    <path d="M132 366 a14 20 0 0 1 28 0 z" />
  </g>
  <text class="lbl-sm" x="146" y="384" text-anchor="middle">продавец</text>

  <!-- покупатель у входа -->
  <g class="person" opacity=".75">
    <circle cx="256" cy="352" r="11" />
    <path d="M242 392 a14 20 0 0 1 28 0 z" />
  </g>
</svg>
