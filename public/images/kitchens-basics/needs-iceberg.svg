<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Айсберг потребностей при покупке кухни: над водой кухня, мойка и техника, под водой метраж, фурнитура, доводчики, столешница и стеновая панель">
  <defs>
    <style>
      .water { fill: #0ea5e9; fill-opacity: .08; }
      .line { stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .ice-top { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; stroke-linejoin: round; }
      .ice-deep { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; stroke-linejoin: round; }
      .cap { font: 800 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .role { font: 600 12.5px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .hint { font: 500 11.5px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .title { font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; text-anchor: middle; letter-spacing: 1.5px; }
      .band { font: 700 11px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0284c7; text-anchor: middle; letter-spacing: 1.2px; }
      .band-top { fill: #b45309; }
      .chip-top { fill: #ffffff; stroke: #fcd34d; stroke-width: 2; }
      .chip { fill: #ffffff; stroke: #bae6fd; stroke-width: 2; }
      .chip-money { fill: #ffffff; stroke: #34d399; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Светлая подложка: схема живёт и в тёмном кабинете, и на белой раздатке. -->
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" />
  <rect class="water" x="0" y="126" width="640" height="274" rx="14" />

  <text class="title" x="320" y="28">АЙСБЕРГ ПОТРЕБНОСТЕЙ</text>

  <!-- Над водой: то, за чем клиент пришёл -->
  <path class="ice-top" d="M320 42 L432 118 H208 Z" />

  <rect class="chip-top" x="84" y="52" width="112" height="40" rx="9" />
  <text class="role" x="140" y="70">Кухня</text>
  <text class="hint" x="140" y="85">сама по себе</text>

  <rect class="chip-top" x="264" y="48" width="112" height="40" rx="9" />
  <text class="role" x="320" y="66">Мойка</text>
  <text class="hint" x="320" y="81">классика</text>

  <rect class="chip-top" x="444" y="52" width="112" height="40" rx="9" />
  <text class="role" x="500" y="70">Техника</text>
  <text class="hint" x="500" y="85">встроенная</text>

  <text class="band band-top" x="320" y="110">НАД ВОДОЙ</text>

  <!-- Линия воды -->
  <line class="line" x1="16" y1="126" x2="624" y2="126" />
  <text class="hint" x="320" y="144">За этим пришли: клиент называет три позиции и держит в голове одну сумму</text>

  <!-- Под водой: то, что выкапывает продавец -->
  <path class="ice-deep" d="M208 156 H432 L536 330 H104 Z" fill-opacity=".35" />

  <text class="band" x="320" y="176">ПОД ВОДОЙ — ЭТО ВЫКАПЫВАЕТ ПРОДАВЕЦ</text>

  <rect class="chip" x="150" y="190" width="108" height="42" rx="9" />
  <text class="role" x="204" y="208">Метраж</text>
  <text class="hint" x="204" y="224">и конфигурация</text>

  <rect class="chip" x="266" y="190" width="108" height="42" rx="9" />
  <text class="role" x="320" y="208">Фурнитура</text>
  <text class="hint" x="320" y="224">по максимуму</text>

  <rect class="chip" x="382" y="190" width="108" height="42" rx="9" />
  <text class="role" x="436" y="208">Доводчики</text>
  <text class="hint" x="436" y="224">апселл к чеку</text>

  <rect class="chip" x="180" y="244" width="132" height="42" rx="9" />
  <text class="role" x="246" y="262">Столешница</text>
  <text class="hint" x="246" y="278">материал и кромка</text>

  <rect class="chip" x="328" y="244" width="132" height="42" rx="9" />
  <text class="role" x="394" y="262">Стеновая панель</text>
  <text class="hint" x="394" y="278">почти не называют сами</text>

  <!-- Дно: деньги -->
  <rect class="chip-money" x="170" y="300" width="300" height="44" rx="10" />
  <text class="role" x="320" y="320">На дне лежит средний чек</text>
  <text class="hint" x="320" y="336">разница между «думал» и «вышло»</text>

  <text class="hint" x="320" y="374" style="font-style: italic">Подводная часть не всплывает сама — её достают вопросами</text>
</svg>
