<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения · ACTIVE SALES</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      svg { color: #f59e0b; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #f59e0b;
        color: #020617;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M20 44 L32 20 L44 44" stroke-linejoin="round" />
      </svg>
      <h1>Нет соединения с интернетом</h1>
      <p>Видеоуроки и материалы доступны только онлайн. Проверьте подключение и попробуйте снова.</p>
      <button onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
